<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add User</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row border main-container">
        <!-- sidebar -->
        <div
          class="col-md-2 border bg-info-subtle mt-4 d-none d-md-block"
          id="sidebar"
        ></div>
        <div class="col-md-10 border p-0 content-bg">
          <!-- navbar -->
          <nav
            class="navbar navbar-expanded-lg bg-primary bg-gradient justify-content-end align-items-center navbar-light fixed-top"
            style="height: 50px"
          >
            <img
              src="./images/icons/customer.svg"
              alt="User-icon"
              class="me-3"
            />
          </nav>

          <!-- dashboard -->
          <div class="col-12 pt-5 content-bg p-3">
            <!-- Add User header -->
            <div class="row align-items-center d-flex flex-wrap">
              <h1 class="fs-4 col-6 col-md-3 text-primary">Add New User</h1>
              <div class="col-6 col-md-9 d-flex justify-content-end">
                <button type="button" class="btn btn-primary my-3">
                  <a
                    href="./User.html"
                    style="text-decoration: none; color: white"
                    ><i class="fa-solid fa-less-than"></i> Back</a
                  >
                </button>
              </div>
            </div>

            <!-- Form -->
            <div class="shadow card container-fluid p-3">
              <form action="" class="row needs-validation">
                <div>
                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input
                          type="firstName"
                          class="form-control"
                          id="firstName"
                          placeholder="firstName"
                          name="firstName"
                          required
                        />
                        <label for="firstName">First Name</label>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-floating">
                        <input
                          type="text"
                          class="form-control"
                          id="lastName"
                          placeholder="lastName"
                          name="lastName"
                          required
                        />
                        <label for="lastName">lastName</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div>
                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input
                          type="text"
                          class="form-control"
                          id="userName"
                          placeholder="name"
                          name="userName"
                          required
                        />
                        <label for="userName">User Name</label>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <select
                          class="form-select"
                          id="select-role"
                          aria-label="Role"
                          required
                        >
                          <option selected>Open this select menu</option>
                          <option value="1">Admin</option>
                          <option value="2">Account</option>
                          <option value="3">chef</option>
                        </select>
                        <label for="floatingSelect">Role</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div>
                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input
                          type="email"
                          class="form-control"
                          id="floatingInput"
                          placeholder="name@example.com"
                          name="email"
                          required
                        />
                        <label for="floatingInput">Email address</label>
                      </div>
                    </div>
                    <div class="form-input-div col-md-6 ">
                      <div class="form-floating mb-3">
                        <input
                          type="password"
                          class="form-control"
                          id="addUserPassword"
                          placeholder="Password"
                          name="password"
                          required
                        />
                        <label for="addUserPassword">Password</label>
                      </div>
                      <span class="form-input-icon me-3"
                        ><i
                          class="fa-solid fa-eye"
                          id="addUserEyeBtn"
                          style="color: gray"
                        ></i>
                      </span>
                    </div>
                  </div>
                </div>
                <div>
                  <div class="row mb-3 d-flex justify-content-center px-3">
                    <div
                      class="col-md-12 border-btn d-flex p-0 justify-content-center"
                    >
                      <label for="files" class="btn p-3 w-100 border-0 p-0">
                        <img
                          src="./images/icons/cloud-upload-icon.svg"
                          alt="upload-file-icon"
                        />
                        <p>Browse File</p>
                      </label>
                      <input
                        id="files"
                        type="file"
                        class="input-file border-0 position-absolute invisible"
                      />
                    </div>
                  </div>
                </div>
                <div>
                  <div class="row">
                    <div class="col-md-4">
                      <div class="form-floating mb-3">
                        <select
                          class="form-select"
                          id="select-country"
                          aria-label="Select Country"
                          required
                        >
                          <option selected>Select Country</option>
                          <option value="1">Admin</option>
                          <option value="2">Account Manager</option>
                          <option value="3">Chef</option>
                        </select>
                        <label for="select-country">Country</label>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-floating mb-3">
                        <select
                          class="form-select"
                          id="select-state"
                          aria-label="Select State"
                          required
                        >
                          <option selected>Select State</option>
                          <option value="1">Admin</option>
                          <option value="2">Account Manager</option>
                          <option value="3">Chef</option>
                        </select>
                        <label for="select-state">State</label>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-floating mb-3">
                        <select
                          class="form-select"
                          id="select-city"
                          aria-label="Select City"
                          required
                        >
                          <option selected>Select City</option>
                          <option value="1">Admin</option>
                          <option value="2">Account Manager</option>
                          <option value="3">Chef</option>
                        </select>
                        <label for="select-city">City</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div>
                  <div class="row">
                    <div class="col-md-4">
                      <div class="form-floating">
                        <input
                        type="text"
                        placeholder="Zipcode"
                        class="form-control p-2"
                        name="zipcode"
                        required
                      />
                      <label for="zipcode">Zipcode</label>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-floating mb-3">
                        <input
                          type="text"
                          placeholder="Address"
                          class="form-control p-2"
                          name="address"
                          required
                        />
                        <label for="address">Address</label>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-floating mb-3">
                        <input
                          type="text"
                          placeholder="Phone"
                          class="form-control p-2"
                          name="phone"
                          required
                        />
                        <label for="phone">Phone</label>
                      </div>
                    </div>
                    
                  </div>
                </div>
                <div>
                  <div class="mt-2">
                    <button class="btn btn-primary" type="submit">
                      Create User
                    </button>
                    <button class="btn btn-outline-primary">Cancel</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/custome.js"></script>
  </body>
</html>
