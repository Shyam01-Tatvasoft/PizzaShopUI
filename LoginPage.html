<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container-fluid d-flex" id="login-page">
      <div class="row">
        <section class="col-md-6 d-flex p-0">
          <img
            src="./images/dominos_background.jpg"
            alt="dominos_background"
            class="img-fluid"
            id="login-img"
          />
        </section>
        <section
          class="col-md-6 d-flex justify-content-center align-items-center bg-info-subtle"
        >
          <div class="col-md-9 justify-content-center">
            <div class="row mb-5">
              <div class="d-flex align-items-center justify-content-center p-0">
                <img
                  src="./images/logos/pizzashop_logo.png"
                  alt="pizzashop_logo"
                  id="pizzashop_logo"
                />
                <h1 class="text-primary">PIZZASHOP</h1>
              </div>
            </div>
            <div class="row">
              <h5>Welcome,</h5>
              <form id="loginForm" method="post">
                <div class="form-input-div my-3">
                  <input
                    type="text"
                    placeholder="Email*"
                    class="form-control p-2"
                    name="email"
                    required
                  />
                  <span class="form-input-icon"
                    ><i class="fa-solid fa-user" style="color: gray"></i>
                  </span>
                </div>
                <div class="form-input-div my-3">
                  <input
                    type="text"
                    placeholder="Password*"
                    class="form-control p-2"
                    name="Password"
                    minlength="5"
                    required
                    id="Password"
                  />
                  <span class="form-input-icon"
                    ><i class="fa-solid fa-eye" id="eye-icon" style="color: gray"></i>
                  </span>
                </div>
                <div class="d-flex justify-content-between">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                        <label class="form-check-label" for="flexCheckDefault">
                          Remember me
                        </label>
                      </div>
                    <span>
                        <a href="#">Forgot Password</a>
                    </span>
                </div>
                <div class="my-3">
                    <button class="btn btn-primary w-100" type="submit" >Login</button>
                </div>
              </form>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/custome.js"></script>
  </body>
</html>
