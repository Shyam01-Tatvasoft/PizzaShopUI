<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="container-fluid d-flex p-0" id="login-page">
        <div class="row m-0 w-100">
          <section class="col-md-6 d-none d-md-flex p-0">
            <img
              src="./images/dominos_background.jpg"
              alt="dominos_background"
              class="img-fluid"
              id="login-img"
            />
          </section>
          <section
            class="col-md-6 d-flex justify-content-center align-items-center bg-info-subtle"
            id="login-form-section"
          >
            <div class="col-md-9 justify-content-center">
              <div class="row mb-5">
                <div class="d-flex align-items-center justify-content-center p-0">
                  <img
                    src="./images/logos/pizzashop_logo.png"
                    alt="pizzashop_logo"
                    id="pizzashop_logo"
                  />
                  <h1 class="text-primary">PIZZASHOP</h1>
                </div>
              </div>
              <div class="row">
                <h4>Forgot Password</h4>
                <p class="mt-3">Enter your email and we'll send you a Link to reset your password.</p>
                <form method="post">
                  <div class="form-input-div mb-1">
                    <input
                      type="text"
                      placeholder="Email*"
                      class="form-control p-2"
                      name="email"
                      required
                    />
                    <span class="form-input-icon"
                      ><i class="fa-solid fa-user" style="color: gray"></i>
                    </span>
                    <p></p>
                  </div>
                  <div class="mb-2 mt-1">
                      <button class="btn btn-primary w-100" type="submit" >Send</button>
                  </div>
                  <div class="text-center"><a href="./LoginPage.html">Back to login</a></div>
                </form>
              </div>
            </div>
          </section>
        </div>
      </div>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/custome.js"></script>
</body>
</html>
