<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row vh-100">
        <!-- sidebar -->
        <div
          class="col-md-2 bg-info-subtle mt-4 d-none d-md-block"
          id="sidebar"
        ></div>
        <div class="col-md-10 content-bg p-3">
          <!-- navbar -->
          <nav
            class="navbar navbar-expanded-lg bg-primary bg-gradient justify-content-end align-items-center navbar-light fixed-top"
            style="height: 50px"
          >
            <img
              src="./images/icons/customer.svg"
              alt="User-icon"
              class="me-3"
            />
          </nav>

          <!-- Main Content -->
          <div class="col-12 mt-5 ">
            <!-- User header -->
            <div class="row align-items-center d-flex flex-wrap">
              <h1 class="text-primary col-2">Users</h1>
              <div class="col-10 d-flex justify-content-end">
                <div class="form-input-div my-3 me-3">
                  <input
                    type="text"
                    placeholder="Search*"
                    class="form-control p-2 d-none d-sm-block"
                    name="search"
                    minlength="5"
                    required
                    id="search"
                  />
                  <span class="form-input-icon"
                    ><i
                      class="fa-solid fa-search"
                      id="eye-icon"
                      style="color: gray"
                    ></i>
                  </span>
                </div>
                <button type="button" class="btn btn-primary my-3">
                  <a
                    href="./AddUser.html"
                    style="text-decoration: none; color: white"
                    >+ Add User</a
                  >
                </button>
              </div>
            </div>

            <!-- Table -->
            <section class="table-responsive shadow card">
              <table class="table user-table mb-0">
                <thead>
                  <tr>
                    <th scope="col">
                      Name <i class="fa-solid fa-up-long"></i
                      ><i class="fa-solid fa-down-long"></i>
                    </th>
                    <th scope="col">Email</th>
                    <th scope="col">Phone</th>
                    <th scope="col">
                      Role
                      <span
                        ><i class="fa-solid fa-up-long"></i
                        ><i class="fa-solid fa-down-long"></i
                      ></span>
                    </th>
                    <th scope="col">Status</th>
                    <th scope="col">Action</th>
                  </tr>
                </thead>
                <tbody class="table-group-devider">
                  <tr>
                    <th scope="row">
                      <img src="./images/Default_pfp.svg.png" alt="user-icon" class="user-icon">
                      1
                    </th>
                    <td>Mark</td>
                    <td>Otto</td>
                    <td>@mdo</td>
                    <td><p class="user-active">Active</p></td>
                    <td>
                      <i class="fa-solid fa-pen me-3"></i>
                      <button
                        type="button"
                        class="btn"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteModal"
                      >
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">
                      <img src="./images/Default_pfp.svg.png" alt="user-icon" class="user-icon">
                      1
                    </th>
                    <td>Mark</td>
                    <td>Otto</td>
                    <td>@mdo</td>
                    <td><p class="user-active">Active</p></td>
                    <td>
                      <i class="fa-solid fa-pen me-3"></i>
                      <button
                        type="button"
                        class="btn"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteModal"
                      >
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">
                      <img src="./images/Default_pfp.svg.png" alt="user-icon" class="user-icon">
                      1
                    </th>
                    <td>Mark</td>
                    <td>Otto</td>
                    <td>@mdo</td>
                    <td><p class="user-inactive">Inactive</p></td>
                    <td>
                      <i class="fa-solid fa-pen me-3"></i>
                      <button
                        type="button"
                        class="btn"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteModal"
                      >
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>
                  <!-- <tfoot> -->
                  <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td
                      class="d-flex justify-content-end me-0 align-items-center"
                    >
                      <p class="mb-0">Items Per page</p>
                      <select class="ms-3" aria-label="Default select example">
                        <option selected>5</option>
                        <option value="10">10</option>
                        <option value="15">15</option>
                      </select>
                      <p class="mb-0 ms-2">Select 1 out of 12</p>
                      <button class="btn btn-light">
                        <i class="fa-solid fa-less-than"></i>
                      </button>
                      <button class="btn btn-light">
                        <i class="fa-solid fa-greater-than"></i>
                      </button>
                    </td>
                  </tr>

                  <!-- </tfoot> -->
                </tbody>
              </table>
            </section>

            <!-- Modal -->
            <div
              class="modal fade"
              id="deleteModal"
              tabindex="-1"
              aria-labelledby="exampleModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                  <div class="modal-header border-0">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">
                      Delete Confirmation
                    </h1>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body text-center p-1">
                    <img src="./images/toppng.com-warning-icon-2400x2400.png" alt="alert-icon" id="aleret-icon">
                    <p class="fw-bold mb-0">Are you sure you want to delete this user?</p>
                  </div>
                  <div class="modal-footer d-flex justify-content-center border-0">
                    
                    <button type="button" class="btn btn-primary">
                      Yes
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-primary"
                      data-bs-dismiss="modal"
                    >
                      No
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/custome.js"></script>
  </body>
</html>
